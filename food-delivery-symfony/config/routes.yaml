controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

app_home:
    path: /
    controller: App\Controller\HomeController::index

app_restaurant_index:
    path: /restaurants
    controller: App\Controller\RestaurantController::index

app_restaurant_show:
    path: /restaurant/{id}
    controller: App\Controller\RestaurantController::show

app_cart_add:
    path: /cart/add
    controller: App\Controller\CartController::add
    methods: [POST]

app_cart_index:
    path: /cart
    controller: App\Controller\CartController::index

app_login:
    path: /login
    controller: App\Controller\SecurityController::login

app_logout:
    path: /logout
    controller: App\Controller\SecurityController::logout

app_register:
    path: /register
    controller: App\Controller\SecurityController::register
